name: Daily Shorts

# 하루 두 번, 채널마다:
#   01:45 UTC(=10:45 KST) → 본 채널(@rrankue, 영어 화면) 11시 전후 공개 + 댓글
#   12:20 UTC(=19:20 베트남) → 베트남 채널(@rankue_vn, 베트남어 화면) 저녁 7시 반 전후 공개 + 댓글 — 그날 본 채널과 같은 샷이 보통 고른다
# (11시 KST = 미국 동부 전날 밤 9~10시 — 한국 점심 전 · 미국 저녁을 함께 잡는 시각. GitHub 예약은 몇 분 늦게 시작할 수 있다)
# 고르는 법 · 제목 · 댓글은 scripts/shorts/daily.ts · meta.ts. 올린 샷 기록은 채널 설명의 Shot ID 라 커밋하지 않는다
# (main 푸시마다 Vercel 운영 배포가 돌기 때문).
on:
  schedule:
    - cron: "45 1 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "public = 공개 업로드 · private = 비공개 시험 · dry = 영상만 만들기"
        required: false
        default: "public"
      channel:
        description: "main = 본 채널(@rrankue) · vn = 베트남 채널(@rankue_vn)"
        required: false
        default: "main"

concurrency:
  group: daily-shorts-${{ github.event.schedule || inputs.channel || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium (headless WebGL) + ffmpeg + Pretendard
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o /tmp/pre.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -oq /tmp/pre.zip -d /tmp/pre
          find /tmp/pre -name 'Pretendard-*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          fc-list | grep -i pretendard | head -3

      - name: Make and upload today's short
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_RANKUE: ${{ secrets.YT_REFRESH_RANKUE }}
          YT_REFRESH_RANKUE_VN: ${{ secrets.YT_REFRESH_RANKUE_VN }}
          MODE: ${{ inputs.mode || 'public' }}
          CHANNEL: ${{ github.event.schedule == '20 12 * * *' && 'vn' || inputs.channel || 'main' }}
        run: |
          case "$MODE" in
            private) npx tsx scripts/shorts/daily.ts --channel "$CHANNEL" --private ;;
            dry) npx tsx scripts/shorts/daily.ts --channel "$CHANNEL" --dry ;;
            *) npx tsx scripts/shorts/daily.ts --channel "$CHANNEL" ;;
          esac

      # 오늘 만든 영상 · 제목 · 사실을 7일 동안 받아 볼 수 있게(프레임은 빼고)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          retention-days: 7
          path: |
            scripts/shorts/out/*/output.mp4
            scripts/shorts/out/*/meta.json
            scripts/shorts/out/*/facts.json
            scripts/shorts/out/*/upload.json
          if-no-files-found: ignore
