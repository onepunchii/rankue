name: hiq_billiard
description: A hybrid AI billiard simulation app.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.8.0
  flame_forge2d: ^0.15.0
  provider: ^6.0.5
  json_annotation: ^4.8.1
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/shot_data.json
    - assets/images/
