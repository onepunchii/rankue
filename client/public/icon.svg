<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="5" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad1)" filter="url(#shadow)" />
  
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-weight="bold" font-size="280" fill="white" text-anchor="middle" dy=".35em">P</text>
  
  <path d="M330 330 L380 280 M330 330 L300 300" stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
