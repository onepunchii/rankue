<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Content Container -->
  <g>
    <!-- Large Premium R -->
    <text x="50%" y="52%" font-family="'Inter', sans-serif" font-weight="900" font-size="320" fill="white" text-anchor="middle" dy=".35em" letter-spacing="-5" style="filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.3));">R</text>
  </g>
</svg>
